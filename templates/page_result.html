<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f4f5f7; margin:0; padding:64px 16px; color:#111827; }
  .card { max-width:480px; margin:0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:40px 32px; text-align:center; }
  .icon { font-size:40px; margin-bottom:12px; }
  .icon.ok { color:#16a34a; }
  .icon.bad { color:#dc2626; }
  .icon.warn { color:#d97706; }
  h1 { font-size:20px; margin:0 0 8px 0; }
  p { color:#4b5563; font-size:14px; line-height:1.5; }
  .meta { margin-top:24px; font-size:12px; color:#9ca3af; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon {{ icon_class }}">{{ icon }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="meta">Request ID: {{ request_id }}</div>
  </div>
</body>
</html>
